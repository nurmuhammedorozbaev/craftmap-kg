{% extends 'backend/base.html' %}
{% block title %}Бронирование{% endblock %}

{% block content %}
<section class="min-h-screen bg-gradient-to-r from-green-100 via-white to-green-200 py-16 px-6">
  <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-lg p-8 border border-green-300">

    <!-- Заголовок -->
    <h1 class="text-3xl font-bold text-green-800 mb-6 text-center">
      Забронировать мастер-класс
    </h1>

    <!-- Информация о ремесле -->
    <div class="mb-6 text-center">
      <h2 class="text-xl font-semibold text-green-700">{{ craft.name }}</h2>
      <p class="text-gray-600">{{ craft.region.name|default:"Регион не указан" }}</p>
      <p class="text-gray-600">{{ craft.category.name|default:"Без категории" }}</p>
    </div>

    <!-- Форма -->
    <form method="post" class="space-y-6">
      {% csrf_token %}

      <!-- Дата -->
      <div>
        <label for="date" class="block text-sm font-medium text-gray-700 mb-2">Дата</label>
        <input type="date" id="date" name="date"
               class="w-full px-4 py-2 border border-green-300 rounded-lg focus:ring-2 focus:ring-green-700 outline-none"
               required>
      </div>

      <!-- Заметки -->
      <div>
        <label for="notes" class="block text-sm font-medium text-gray-700 mb-2">Комментарий</label>
        <textarea id="notes" name="notes" rows="4"
                  class="w-full px-4 py-2 border border-green-300 rounded-lg focus:ring-2 focus:ring-green-700 outline-none"
                  placeholder="Например: хочу изучить традиционную технику..."></textarea>
      </div>

      <!-- Кнопки -->
      <div class="flex justify-center gap-4">
        <button type="submit"
                class="bg-green-700 text-white px-6 py-2 rounded-lg font-semibold hover:bg-green-800 transition">
          Забронировать
        </button>
        <a href="{% url 'backend:craft_detail' craft.id %}"
           class="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg font-semibold hover:bg-gray-300 transition">
          Отмена
        </a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
