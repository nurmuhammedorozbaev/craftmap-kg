{% extends 'backend/base.html' %} {% block title %}Спасибо{% endblock %} {%
block content %}
<section
  class="min-h-screen bg-gradient-to-r from-green-100 via-white to-green-200 py-12 px-4"
>
  <div
    class="w-full max-w-sm sm:max-w-md lg:max-w-xl mx-auto bg-white/90 rounded-xl shadow-lg px-4 sm:px-8 py-8 border border-green-300 text-center"
  >
    <h2 class="text-xl sm:text-2xl font-bold text-green-800 mb-4">
      ✅ Заявка успешно отправлена!
    </h2>
    <p class="text-sm sm:text-base text-gray-700 mb-6">
      Мы свяжемся с вами для подтверждения участия.
    </p>

    <div class="flex flex-col sm:flex-row justify-center gap-4">
      <a
        href="{% url 'backend:profile' %}"
        class="w-full sm:w-auto bg-green-800 text-white font-semibold py-3 px-6 rounded-lg hover:bg-green-900 transition text-center"
      >
        Перейти в профиль
      </a>
      <a
        href="{% url 'backend:crafts' %}"
        class="w-full sm:w-auto bg-green-100 border border-green-300 text-green-800 font-semibold py-3 px-6 rounded-lg hover:bg-green-200 transition text-center"
      >
        Смотреть другие ремёсла
      </a>
    </div>
  </div>
</section>
{% endblock %}
