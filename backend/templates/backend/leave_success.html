{% extends 'backend/base.html' %}
{% block title %}Заявка отправлена{% endblock %}

{% block content %}
<section class="min-h-screen bg-gradient-to-r from-green-100 via-white to-green-200 py-12 px-4">
  <div class="w-full max-w-sm sm:max-w-md lg:max-w-lg mx-auto bg-white/90 rounded-xl shadow-lg px-4 sm:px-8 py-8 border border-green-300 text-center">
    <h2 class="text-xl sm:text-2xl font-bold text-green-800 mb-4">Спасибо, {{ name }}!</h2>
    <p class="text-sm sm:text-base text-gray-700 mb-6">
      Ваша заявка на <span class="font-semibold text-green-800">"{{ craft.name }}"</span> успешно отправлена.
    </p>
    <a href="{% url 'backend:crafts' %}" 
       class="inline-block w-full sm:w-auto bg-green-800 text-white py-3 px-6 rounded-lg font-semibold hover:bg-green-900 transition">
       ← Вернуться к списку ремёсел
    </a>
  </div>
</section>
{% endblock %}
