{% extends 'backend/base.html' %}
{% block title %}Регистрация{% endblock %}

{% block content %}
<section class="min-h-screen flex items-center justify-center bg-gradient-to-br from-green-700 via-green-600 to-green-800 relative px-4">
  <!-- затемнение -->
  <div class="absolute inset-0 bg-black/30"></div>

  <!-- форма -->
  <div class="relative z-10 w-full max-w-sm sm:max-w-md mx-auto bg-green-50/95 px-4 sm:px-8 py-8 rounded-xl shadow-2xl border border-green-500 backdrop-blur-sm">
    <h2 class="text-2xl sm:text-3xl font-extrabold text-green-900 mb-6 text-center">Регистрация</h2>

    <form method="post" class="space-y-4">
      {% csrf_token %}

      <!-- Имя пользователя -->
      <div>
        <label class="block text-sm font-medium text-green-900 mb-1">Имя пользователя</label>
        {{ form.username }}
      </div>

      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-green-900 mb-1">Email</label>
        {{ form.email }}
      </div>

      <!-- Телефон -->
      <div>
        <label class="block text-sm font-medium text-green-900 mb-1">Телефон</label>
        {{ form.phone }}
      </div>

      <!-- Роль -->
      <div>
        <label class="block text-sm font-medium text-green-900 mb-1">Роль</label>
        {{ form.role }}
      </div>

      <!-- Пароль -->
      <div>
        <label class="block text-sm font-medium text-green-900 mb-1">Пароль</label>
        <div class="relative">
          {{ form.password1 }}
          <button type="button" onclick="togglePassword('id_password1', this)" 
                  class="absolute inset-y-0 right-0 px-3 text-xs sm:text-sm text-green-700 hover:text-green-900">
            Показать
          </button>
        </div>
      </div>

      <!-- Повторите пароль -->
      <div>
        <label class="block text-sm font-medium text-green-900 mb-1">Повторите пароль</label>
        <div class="relative">
          {{ form.password2 }}
          <button type="button" onclick="togglePassword('id_password2', this)" 
                  class="absolute inset-y-0 right-0 px-3 text-xs sm:text-sm text-green-700 hover:text-green-900">
            Показать
          </button>
        </div>
      </div>

      <!-- Кнопка регистрации -->
      <button type="submit" 
              class="w-full bg-green-700 text-white font-semibold py-3 px-4 rounded-lg hover:bg-green-800 transition">
        Зарегистрироваться
      </button>
    </form>

    <p class="mt-4 text-sm sm:text-base text-green-900 text-center">
      Уже есть аккаунт? 
      <a href="{% url 'backend:login' %}" class="text-green-700 hover:text-green-900 font-semibold">Войдите</a>
    </p>
  </div>
</section>

<script>
function togglePassword(id, btn) {
  const input = document.getElementById(id);
  if (input.type === "password") {
    input.type = "text";
    btn.textContent = "Скрыть";
  } else {
    input.type = "password";
    btn.textContent = "Показать";
  }
}
</script>
{% endblock %}
