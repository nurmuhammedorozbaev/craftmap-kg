{% extends 'backend/base.html' %}
{% block title %}Карта ремёсел{% endblock %}
{% block content %}
<section class="min-h-screen bg-gradient-to-r from-green-100 via-white to-green-200 py-10 px-4">
  <div class="w-full max-w-sm sm:max-w-md lg:max-w-7xl mx-auto bg-white rounded-xl shadow-lg px-4 sm:px-6 py-6 border border-green-300">
    <h2 class="text-2xl sm:text-3xl font-bold text-green-800 mb-6 text-center">
      Интерактивная карта ремёсел Кыргызстана
    </h2>

    <div id="map" class="w-full h-64 sm:h-[600px] rounded-lg border border-green-400"></div>
  </div>
</section>

<!-- Leaflet карта -->
<script>
  document.addEventListener("DOMContentLoaded", function() {
    var map = L.map('map').setView([41.426, 75.991], 7);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // 💚 Кастомная зелёная иконка
    var greenIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    // ✅ Добавляем маркеры ремёсел
    {% for craft in crafts %}
      {% if craft.latitude and craft.longitude %}
        var marker = L.marker([{{ craft.latitude }}, {{ craft.longitude }}], {icon: greenIcon}).addTo(map);
        marker.bindPopup(`
          <div style="text-align:center; max-width:200px;">
            <h3 style="color:#166534; font-weight:bold; font-size:14px;">{{ craft.name }}</h3>
            <p style="color:#374151; font-size:12px;">{{ craft.region.name|default:"Регион не указан" }}</p>
            {% if craft.image %}
              <img src="{{ craft.image.url }}" alt="{{ craft.name }}" style="width:100%; border-radius:8px; margin:6px 0;">
            {% endif %}
            <p style="font-size:12px;"><strong>Категория:</strong> {{ craft.category.name|default:"-" }}</p>
            <p style="font-size:12px;"><strong>Цена:</strong> {{ craft.price|default:"-" }} сом</p>
            <a href="{% url 'backend:craft_detail' craft.id %}"
               style="display:inline-block; margin-top:6px; background:#166534; color:white; padding:6px 10px; border-radius:6px; text-decoration:none; font-size:12px;">
               Подробнее
            </a>
          </div>
        `);
      {% endif %}
    {% endfor %}
  });
</script>
{% endblock %}
